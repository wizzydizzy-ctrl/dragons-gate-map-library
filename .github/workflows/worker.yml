name: Test submission worker

on:
  pull_request:
    paths:
      - "worker/**"
      - "package.json"
      - "wrangler.toml"
      - ".github/workflows/worker.yml"
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "package.json"
      - "wrangler.toml"
      - ".github/workflows/worker.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
